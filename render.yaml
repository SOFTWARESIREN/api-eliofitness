services:
  - type: web
    name: eliofitness-api
    runtime: php
    buildCommand: php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');" && php composer-setup.php && php -r "unlink('composer-setup.php');" && php composer.phar install --no-interaction --prefer-dist --optimize-autoloader && php artisan config:cache && php artisan route:cache
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: ElioFitness
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: 120

databases:
  - name: eliofitness-db
    plan: free
    databaseName: eliofitness
    user: eliofitness_user
